x-api: &default-api
  image: ghcr.io/stssocialst-stp/openimis-be-stp:latest
  environment:
    - DB_DEFAULT=${DB_DEFAULT:-postgresql}
    - DB_HOST=${DB_HOST}
    - DB_PORT=${DB_PORT}
    - DB_NAME=${DB_NAME}
    - DB_USER=${DB_USER}
    - DB_PASSWORD=${DB_PASSWORD}
    - SITE_ROOT=api
    - SITE_URL=${DOMAIN}
    - CELERY_BROKER_URL=amqp://rabbitmq
    - MODE=${MODE:-Prod}
    - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
  volumes:
    - photos:/openimis-be/openIMIS/images/insurees
  networks:
    - openimis-net
  restart: always

services:
  frontend:
    container_name: ${PROJECT_NAME:-openimis}-frontend
    image: ghcr.io/stssocialst-stp/openimis-fe-stp:latest
    restart: always
    env_file: .env
    environment:
      - REACT_APP_API_URL=api
      - NEW_OPENIMIS_HOST=${DOMAIN}
      - OPENIMIS_CONF_JSON=${OPENIMIS_FE_CONF_JSON}
      - OPENSEARCH_BASIC_TOKEN=${OPENSEARCH_BASIC_TOKEN}
    networks:
      - openimis-net
    ports:
      - ${HTTP_PORT:-4005}:80
      - ${HTTPS_PORT:-4006}:443
    depends_on:
      - backend
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - ./conf/nginx:/conf/

  backend:
    <<: *default-api
    container_name: ${PROJECT_NAME:-openimis}-api
    command: start
    env_file: .env
    ports:
      - 4007:8000

  worker:
    <<: *default-api
    container_name: ${PROJECT_NAME:-openimis}-worker
    command: worker
    env_file: .env
    ports:
      - 4008:8000

  rabbitmq:
    container_name: ${PROJECT_NAME:-openimis}-rabbitmq
    image: rabbitmq:3-management
    restart: always
    networks:
      - openimis-net
    ports:
      - 5672:5672
      - 4011:15672

networks:
  openimis-net:
    external: true

volumes:
  database:
  photos:
