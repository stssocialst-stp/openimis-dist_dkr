name: Deploy Backend and Worker
on:
  repository_dispatch:
    types: deploy-kenon-backend

jobs:
  deploy-backend:
    runs-on: self-hosted
    environment: sintaxy-staging
    concurrency:
      group: deploy-sintaxy
      cancel-in-progress: false
    env:
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      DOMAIN: ${{ vars.DOMAIN }}
      HTTP_PORT: ${{ vars.HTTP_PORT }}
      HTTPS_PORT: ${{ vars.HTTPS_PORT }}
      GATEWAY_PORT_S: ${{ vars.GATEWAY_PORT_S }}
      DB_PASSWORD: ${{ vars.DB_PASSWORD }} 
      DB_USER: ${{ vars.DB_USER }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT }}
      DB_ENGINE: ${{ vars.DB_ENGINE }}
      SITE_ROOT: ${{ vars.SITE_ROOT }}
      DB_TAG: ${{ vars.DB_TAG }}
      BE_TAG: ${{ github.event.client_payload.be_tag || vars.BE_TAG }}
      FE_TAG: ${{ vars.FE_TAG }}
      OPENIMIS_FE_CONF_JSON: ${{ vars.OPENIMIS_FE_CONF_JSON }}
      CSRF_TRUSTED_ORIGINS: ${{ vars.CSRF_TRUSTED_ORIGINS }}
      REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
      DJANGO_LOG_LEVEL: ${{ vars.DJANGO_LOG_LEVEL }}
      DJANGO_LOG_HANDLER: ${{ vars.DJANGO_LOG_HANDLER }}
      DJANGO_MIGRATE: ${{ vars.DJANGO_MIGRATE }}
      EMAIL_HOST: ${{ vars.EMAIL_HOST }}
      EMAIL_PORT: ${{ vars.EMAIL_PORT }}
      EMAIL_HOST_USER: ${{ vars.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ vars.EMAIL_HOST_PASSWORD }}
      EMAIL_USE_TLS: ${{ vars.EMAIL_USE_TLS }}
      OPENSEARCH_ADMIN: ${{ vars.OPENSEARCH_ADMIN }}
      OPENSEARCH_PASSWORD: ${{ vars.OPENSEARCH_PASSWORD }}
      OPENSEARCH_BASIC_TOKEN: ${{ vars.OPENSEARCH_BASIC_TOKEN }}
      OPENSEARCH_HOST: ${{ vars.OPENSEARCH_HOST }}
      CELERY_BROKER_URL: ${{ vars.CELERY_BROKER_URL }}
      DATA_UPLOAD_MAX_MEMORY_SIZE: ${{ vars.DATA_UPLOAD_MAX_MEMORY_SIZE }}
      FEED_DATA: ${{ vars.FEED_DATA }}
      BISTP_BASE_URL: ${{ vars.BISTP_BASE_URL }}
      BISTP_API_BASE_PATH: ${{ vars.BISTP_API_BASE_PATH }}
      BISTP_CLIENT_ID: ${{ vars.BISTP_CLIENT_ID }}
      BISTP_CLIENT_SECRET: ${{ secrets.BISTP_CLIENT_SECRET }}
      BISTP_TOKEN_ENDPOINT: ${{ vars.BISTP_TOKEN_ENDPOINT }}
      BISTP_SSL_VERIFY: ${{ vars.BISTP_SSL_VERIFY }}
      BISTP_TIMEOUT: ${{ vars.BISTP_TIMEOUT }}
      BISTP_CALLBACK_TOKEN: ${{ secrets.BISTP_CALLBACK_TOKEN }}

    steps:

      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          clean: false

      - name: Create .env file from workflow env
        run: |
          cat <<EOF > $GITHUB_WORKSPACE/.env
            PROJECT_NAME=${PROJECT_NAME}
            DOMAIN=${DOMAIN}
            HTTP_PORT=${HTTP_PORT}
            HTTPS_PORT=${HTTPS_PORT}
            GATEWAY_PORT_S=${GATEWAY_PORT_S}
            DB_PASSWORD=${DB_PASSWORD}
            DB_USER=${DB_USER}
            DB_NAME=${DB_NAME}
            DB_HOST=${DB_HOST}
            DB_PORT=${DB_PORT}
            DB_ENGINE=${DB_ENGINE}
            SITE_ROOT=${SITE_ROOT}
            DB_TAG=${DB_TAG}
            BE_TAG=${BE_TAG}
            FE_TAG=${FE_TAG}
            OPENIMIS_FE_CONF_JSON=${OPENIMIS_FE_CONF_JSON}
            CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
            REACT_APP_API_URL=${REACT_APP_API_URL}
            DJANGO_LOG_LEVEL=${DJANGO_LOG_LEVEL}
            DJANGO_LOG_HANDLER=${DJANGO_LOG_HANDLER}
            DJANGO_MIGRATE=${DJANGO_MIGRATE}
            EMAIL_HOST=${EMAIL_HOST}
            EMAIL_PORT=${EMAIL_PORT}
            EMAIL_HOST_USER=${EMAIL_HOST_USER}
            EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
            EMAIL_USE_TLS=${EMAIL_USE_TLS}
            OPENSEARCH_ADMIN=${OPENSEARCH_ADMIN}
            OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
            OPENSEARCH_BASIC_TOKEN=${OPENSEARCH_BASIC_TOKEN}
            OPENSEARCH_HOST=${OPENSEARCH_HOST}
            CELERY_BROKER_URL=${CELERY_BROKER_URL}
            DATA_UPLOAD_MAX_MEMORY_SIZE=${DATA_UPLOAD_MAX_MEMORY_SIZE}
            FEED_DATA=${FEED_DATA}
            BISTP_BASE_URL=${BISTP_BASE_URL}
            BISTP_API_BASE_PATH=${BISTP_API_BASE_PATH}
            BISTP_CLIENT_ID=${BISTP_CLIENT_ID}
            BISTP_CLIENT_SECRET=${BISTP_CLIENT_SECRET}
            BISTP_TOKEN_ENDPOINT=${BISTP_TOKEN_ENDPOINT}
            BISTP_SSL_VERIFY=${BISTP_SSL_VERIFY}
            BISTP_TIMEOUT=${BISTP_TIMEOUT}
            BISTP_CALLBACK_TOKEN=${BISTP_CALLBACK_TOKEN}
            EOF
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Deploy backend
        run: |
          cd $GITHUB_WORKSPACE
          docker compose --env-file .env -f docker-compose.base.yml pull backend
          docker compose --env-file .env -f docker-compose.base.yml up -d rabbitmq backend worker

  deploy-backend-dev-client:
    runs-on: coremis-dev
    environment: client-dev
    concurrency:
      group: deploy-client-dev
      cancel-in-progress: false
    env:
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      DOMAIN: ${{ vars.DOMAIN }}
      HTTP_PORT: ${{ vars.HTTP_PORT }}
      HTTPS_PORT: ${{ vars.HTTPS_PORT }}
      GATEWAY_PORT_S: ${{ vars.GATEWAY_PORT_S }}
      DB_PASSWORD: ${{ vars.DB_PASSWORD }}
      DB_USER: ${{ vars.DB_USER }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT }}
      DB_ENGINE: ${{ vars.DB_ENGINE }}
      SITE_ROOT: ${{ vars.SITE_ROOT }}
      DB_TAG: ${{ vars.DB_TAG }}
      BE_TAG: ${{ github.event.client_payload.be_tag || vars.BE_TAG }}
      FE_TAG: ${{ vars.FE_TAG }}
      OPENIMIS_FE_CONF_JSON: ${{ vars.OPENIMIS_FE_CONF_JSON }}
      CSRF_TRUSTED_ORIGINS: ${{ vars.CSRF_TRUSTED_ORIGINS }}
      REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
      DJANGO_LOG_LEVEL: ${{ vars.DJANGO_LOG_LEVEL }}
      DJANGO_LOG_HANDLER: ${{ vars.DJANGO_LOG_HANDLER }}
      DJANGO_MIGRATE: ${{ vars.DJANGO_MIGRATE }}
      EMAIL_HOST: ${{ vars.EMAIL_HOST }}
      EMAIL_PORT: ${{ vars.EMAIL_PORT }}
      EMAIL_HOST_USER: ${{ vars.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ vars.EMAIL_HOST_PASSWORD }}
      EMAIL_USE_TLS: ${{ vars.EMAIL_USE_TLS }}
      OPENSEARCH_ADMIN: ${{ vars.OPENSEARCH_ADMIN }}
      OPENSEARCH_PASSWORD: ${{ vars.OPENSEARCH_PASSWORD }}
      OPENSEARCH_BASIC_TOKEN: ${{ vars.OPENSEARCH_BASIC_TOKEN }}
      OPENSEARCH_HOST: ${{ vars.OPENSEARCH_HOST }}
      CELERY_BROKER_URL: ${{ vars.CELERY_BROKER_URL }}
      DATA_UPLOAD_MAX_MEMORY_SIZE: ${{ vars.DATA_UPLOAD_MAX_MEMORY_SIZE }}
      FEED_DATA: ${{ vars.FEED_DATA }}
      BISTP_BASE_URL: ${{ vars.BISTP_BASE_URL }}
      BISTP_API_BASE_PATH: ${{ vars.BISTP_API_BASE_PATH }}
      BISTP_CLIENT_ID: ${{ vars.BISTP_CLIENT_ID }}
      BISTP_CLIENT_SECRET: ${{ secrets.BISTP_CLIENT_SECRET }}
      BISTP_TOKEN_ENDPOINT: ${{ vars.BISTP_TOKEN_ENDPOINT }}
      BISTP_SSL_VERIFY: ${{ vars.BISTP_SSL_VERIFY }}
      BISTP_TIMEOUT: ${{ vars.BISTP_TIMEOUT }}
      BISTP_CALLBACK_TOKEN: ${{ secrets.BISTP_CALLBACK_TOKEN }}

    steps:
   
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          clean: false

      - name: Create .env file from workflow env
        run: |
          cat <<EOF > $GITHUB_WORKSPACE/.env
            PROJECT_NAME=${PROJECT_NAME}
            DOMAIN=${DOMAIN}
            HTTP_PORT=${HTTP_PORT}
            HTTPS_PORT=${HTTPS_PORT}
            GATEWAY_PORT_S=${GATEWAY_PORT_S}
            DB_PASSWORD=${DB_PASSWORD}
            DB_USER=${DB_USER}
            DB_NAME=${DB_NAME}
            DB_HOST=${DB_HOST}
            DB_PORT=${DB_PORT}
            DB_ENGINE=${DB_ENGINE}
            SITE_ROOT=${SITE_ROOT}
            DB_TAG=${DB_TAG}
            BE_TAG=${BE_TAG}
            FE_TAG=${FE_TAG}
            OPENIMIS_FE_CONF_JSON=${OPENIMIS_FE_CONF_JSON}
            CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
            REACT_APP_API_URL=${REACT_APP_API_URL}
            DJANGO_LOG_LEVEL=${DJANGO_LOG_LEVEL}
            DJANGO_LOG_HANDLER=${DJANGO_LOG_HANDLER}
            DJANGO_MIGRATE=${DJANGO_MIGRATE}
            EMAIL_HOST=${EMAIL_HOST}
            EMAIL_PORT=${EMAIL_PORT}
            EMAIL_HOST_USER=${EMAIL_HOST_USER}
            EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
            EMAIL_USE_TLS=${EMAIL_USE_TLS}
            OPENSEARCH_ADMIN=${OPENSEARCH_ADMIN}
            OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
            OPENSEARCH_BASIC_TOKEN=${OPENSEARCH_BASIC_TOKEN}
            OPENSEARCH_HOST=${OPENSEARCH_HOST}
            CELERY_BROKER_URL=${CELERY_BROKER_URL}
            DATA_UPLOAD_MAX_MEMORY_SIZE=${DATA_UPLOAD_MAX_MEMORY_SIZE}
            FEED_DATA=${FEED_DATA}
            BISTP_BASE_URL=${BISTP_BASE_URL}
            BISTP_API_BASE_PATH=${BISTP_API_BASE_PATH}
            BISTP_CLIENT_ID=${BISTP_CLIENT_ID}
            BISTP_CLIENT_SECRET=${BISTP_CLIENT_SECRET}
            BISTP_TOKEN_ENDPOINT=${BISTP_TOKEN_ENDPOINT}
            BISTP_SSL_VERIFY=${BISTP_SSL_VERIFY}
            BISTP_TIMEOUT=${BISTP_TIMEOUT}
            BISTP_CALLBACK_TOKEN=${BISTP_CALLBACK_TOKEN}
            EOF

      - name: Remove old frontend container if exists
        run: |
          if [ "$(docker ps -a -q -f name=${PROJECT_NAME}-api)" ]; then
            echo "Removing old backend container..."
            docker rm -f ${PROJECT_NAME}-api
          else
            echo "No old backend container found."
          fi
      
          if [ "$(docker ps -a -q -f name=${PROJECT_NAME}-worker)" ]; then
            echo "Removing old worker container..."
            docker rm -f ${PROJECT_NAME}-worker
          else
            echo "No old worker container found."
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Deploy backend
        run: |
          cd $GITHUB_WORKSPACE
          docker compose --env-file .env -f docker-compose.base.yml pull backend
          docker compose --env-file .env -f docker-compose.base.yml up -d rabbitmq backend worker
